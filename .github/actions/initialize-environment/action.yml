# Purpose: This workflow is responsible for initializing the environment for the project.

# Name of the workflow
name: Initialize Environment

inputs:
  SSH_ENABLED:
    description: 'Whether the SSH tunnel is enabled'
    required: true
  SSH_HOST:
    description: 'SSH host'
    required: true
  SSH_USERNAME:
    description: 'SSH username'
    required: true
  SSH_PRIVATE_KEY_PEM:
    description: 'SSH private key in PEM format'
    required: true
  AYS_API_URL:
    description: 'API URL'
    required: true
  AYS_DATABASE_URL:
    description: 'Database URL'
    required: true
  AYS_DATABASE_USERNAME:
    description: 'Database username'
    required: true
  AYS_DATABASE_PASSWORD:
    description: 'Database password'
    required: true
  AYS_TEST_DISASTER_FOUNDATION_ID:
    description: 'Test disaster foundation ID'
    required: true
  AYS_TEST_DISASTER_FOUNDATION_ADMIN_EMAIL_ADDRESS:
    description: 'Test disaster foundation admin email address'
    required: true
  AYS_TEST_DISASTER_FOUNDATION_ADMIN_PASSWORD:
    description: 'Test disaster foundation admin password'
    required: true
  AYS_TEST_DISASTER_FOUNDATION_USER_EMAIL_ADDRESS:
    description: 'Test disaster foundation user email address'
    required: true
  AYS_TEST_DISASTER_FOUNDATION_USER_PASSWORD:
    description: 'Test disaster foundation user password'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_ID:
    description: 'Test volunteer foundation ID'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_SUPER_ADMIN_EMAIL_ADDRESS:
    description: 'Test volunteer foundation super admin email address'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_SUPER_ADMIN_PASSWORD:
    description: 'Test volunteer foundation super admin password'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_ADMIN_EMAIL_ADDRESS:
    description: 'Test volunteer foundation admin email address'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_ADMIN_PASSWORD:
    description: 'Test volunteer foundation admin password'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_USER_EMAIL_ADDRESS:
    description: 'Test volunteer foundation user email address'
    required: true
  AYS_TEST_VOLUNTEER_FOUNDATION_USER_PASSWORD:
    description: 'Test volunteer foundation user password'
    required: true

runs:
  using: composite
  steps: # List of steps to execute within the job
    - name: Update package cache # Step to update the package cache
      run: sudo apt-get update
      shell: bash

    - name: Set up Java # Step to set up the Java environment
      uses: actions/setup-java@v5
      with:
        java-version: 17 # Specify Java 17 as the version
        distribution: 'corretto' # Use the 'corretto' distribution of Java

    - name: Set up Docker # Step to set up the Docker environment
      uses: actions/hello-world-docker-action@v2

    - name: Install Maven # Step to install Maven
      run: sudo apt-get install -y maven
      shell: bash

    - name: Copy configuration.properties file from template # Step to create a new 'configuration.properties' file by copying the 'template-configuration.properties'
      run: cp sample_configuration.properties configuration.properties
      shell: bash

    - name: Replace ssh.enabled in configuration.properties # Step to replace the placeholder ssh.enabled in configuration.properties
      run: sed 's|'{SSH_ENABLED}'|'${{ inputs.SSH_ENABLED }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace ssh.host in configuration.properties # Step to replace the placeholder ssh.host in configuration.properties
      run: sed 's|'{SSH_HOST}'|'${{ inputs.SSH_HOST }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace ssh.username in configuration.properties # Step to replace the placeholder ssh.username in configuration.properties
      run: sed 's|'{SSH_USERNAME}'|'${{ inputs.SSH_USERNAME }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace ssh.private_key_pem in configuration.properties # Step to replace the placeholder ssh.private_key_pem in configuration.properties
      env:
        SSH_PRIVATE_KEY_PEM: ${{ inputs.SSH_PRIVATE_KEY_PEM }}
      run: |
        content=$(cat configuration.properties)
        content=${content//\{SSH_PRIVATE_KEY_PEM\}/$SSH_PRIVATE_KEY_PEM}
        printf '%s\n' "$content" > configuration.properties
      shell: bash

    - name: Replace api.url in configuration.properties # Step to replace the placeholder api.url in configuration.properties
      run: sed 's|'{API_URL}'|'${{ inputs.AYS_API_URL }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace database.url in configuration.properties # Step to replace the placeholder database.url in configuration.properties
      run: sed 's|'{DATABASE_URL}'|'${{ inputs.AYS_DATABASE_URL }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace database.username in configuration.properties # Step to replace the placeholder database.username in configuration.properties
      run: sed 's|'{DATABASE_USERNAME}'|'${{ inputs.AYS_DATABASE_USERNAME }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace database.password in configuration.properties # Step to replace the placeholder database.password in configuration.properties
      run: sed 's|'{DATABASE_PASSWORD}'|'${{ inputs.AYS_DATABASE_PASSWORD }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_disaster_foundation.id in configuration.properties # Step to replace the placeholder test_disaster_foundation.id in configuration.properties
      run: sed 's|'{TEST_DISASTER_FOUNDATION_ID}'|'${{ inputs.AYS_TEST_DISASTER_FOUNDATION_ID }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_disaster_foundation.admin.email_address in configuration.properties # Step to replace the placeholder test_disaster_foundation.admin.email_address in configuration.properties
      run: sed 's|'{TEST_DISASTER_FOUNDATION_ADMIN_EMAIL_ADDRESS}'|'${{ inputs.AYS_TEST_DISASTER_FOUNDATION_ADMIN_EMAIL_ADDRESS }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_disaster_foundation.admin.password in configuration.properties # Step to replace the placeholder test_disaster_foundation.admin.password in configuration.properties
      run: sed 's|'{TEST_DISASTER_FOUNDATION_ADMIN_PASSWORD}'|'${{ inputs.AYS_TEST_DISASTER_FOUNDATION_ADMIN_PASSWORD }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_disaster_foundation.user.email_address in configuration.properties # Step to replace the placeholder test_disaster_foundation.user.email_address in configuration.properties
      run: sed 's|'{TEST_DISASTER_FOUNDATION_USER_EMAIL_ADDRESS}'|'${{ inputs.AYS_TEST_DISASTER_FOUNDATION_USER_EMAIL_ADDRESS }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_disaster_foundation.user.password in configuration.properties # Step to replace the placeholder test_disaster_foundation.user.password in configuration.properties
      run: sed 's|'{TEST_DISASTER_FOUNDATION_USER_PASSWORD}'|'${{ inputs.AYS_TEST_DISASTER_FOUNDATION_USER_PASSWORD }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.id in configuration.properties # Step to replace the placeholder test_volunteer_foundation.id in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_ID}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_ID }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.super_admin.email_address in configuration.properties # Step to replace the placeholder test_volunteer_foundation.super_admin.email_address in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_SUPER_ADMIN_EMAIL_ADDRESS}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_SUPER_ADMIN_EMAIL_ADDRESS }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.super_admin.password in configuration.properties # Step to replace the placeholder test_volunteer_foundation.super_admin.password in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_SUPER_ADMIN_PASSWORD}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_SUPER_ADMIN_PASSWORD }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.admin.email_address in configuration.properties # Step to replace the placeholder test_volunteer_foundation.admin.email_address in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_ADMIN_EMAIL_ADDRESS}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_ADMIN_EMAIL_ADDRESS }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.admin.password in configuration.properties # Step to replace the placeholder test_volunteer_foundation.admin.password in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_ADMIN_PASSWORD}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_ADMIN_PASSWORD }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.user.email_address in configuration.properties # Step to replace the placeholder test_volunteer_foundation.user.email_address in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_USER_EMAIL_ADDRESS}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_USER_EMAIL_ADDRESS }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Replace test_volunteer_foundation.user.password in configuration.properties # Step to replace the placeholder test_volunteer_foundation.user.password in configuration.properties
      run: sed 's|'{TEST_VOLUNTEER_FOUNDATION_USER_PASSWORD}'|'${{ inputs.AYS_TEST_VOLUNTEER_FOUNDATION_USER_PASSWORD }}'|g' configuration.properties >> temp_configuration.properties ; rm configuration.properties ; mv temp_configuration.properties configuration.properties
      shell: bash

    - name: Cache Maven packages # Caching of Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
